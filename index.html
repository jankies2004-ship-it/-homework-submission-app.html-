<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英語課題提出管理</title>
<style>
  :root {
    --green: #3B6D11;
    --green-light: #EAF3DE;
    --green-mid: #639922;
    --gray: #5F5E5A;
    --gray-light: #F1EFE8;
    --border: rgba(0,0,0,0.12);
    --white: #fff;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: #f7f9f5;
    color: #2C2C2A;
    min-height: 100vh;
  }

  .app-header {
    background: var(--green);
    color: #fff;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .app-header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.04em; }
  .mode-toggle {
    display: flex;
    background: rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 3px;
    gap: 2px;
  }
  .mode-btn {
    padding: 5px 18px;
    border: none;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    background: transparent;
    color: rgba(255,255,255,0.75);
    transition: all 0.2s;
  }
  .mode-btn.active { background: #fff; color: var(--green); }
  .admin-logout {
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.12);
    border: none;
    border-radius: 10px;
    padding: 4px 10px;
    cursor: pointer;
    margin-left: 8px;
    font-family: inherit;
  }
  .admin-logout:hover { background: rgba(255,255,255,0.22); color: #fff; }

  .screen { display: none; padding: 20px; max-width: 680px; margin: 0 auto; }
  .screen.active { display: block; }

  /* Cards */
  .card {
    background: var(--white);
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: var(--green); }

  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 12px; color: var(--gray); margin-bottom: 5px; font-weight: 500; }
  .form-row input, .form-row select {
    width: 100%;
    padding: 10px 12px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    background: #fafaf8;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }
  .form-row input:focus, .form-row select:focus { border-color: var(--green-mid); background: #fff; }

  /* Upload */
  .upload-area {
    border: 2px dashed #C0DD97;
    border-radius: var(--radius);
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    background: var(--green-light);
    position: relative;
    transition: all 0.2s;
  }
  .upload-area:hover { border-color: var(--green-mid); background: #dff0c4; }
  .upload-area input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .upload-icon { font-size: 32px; margin-bottom: 10px; }
  .upload-area p { font-size: 13px; color: var(--gray); line-height: 1.6; }
  .upload-area strong { color: var(--green); display: block; margin-bottom: 4px; font-size: 14px; }

  .preview-area { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .preview-item {
    position: relative;
    width: 80px; height: 80px;
    border-radius: var(--radius-sm);
    overflow: hidden;
    border: 0.5px solid var(--border);
  }
  .preview-item img, .preview-item video { width: 100%; height: 100%; object-fit: cover; }
  .preview-remove {
    position: absolute; top: 2px; right: 2px;
    background: rgba(0,0,0,0.6);
    color: #fff; border: none; border-radius: 50%;
    width: 18px; height: 18px; font-size: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .submit-btn {
    width: 100%; padding: 14px;
    background: var(--green); color: #fff; border: none;
    border-radius: var(--radius-sm); font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background 0.2s;
    letter-spacing: 0.04em; font-family: inherit; margin-top: 12px;
  }
  .submit-btn:hover { background: var(--green-mid); }
  .submit-btn:disabled { background: #C0DD97; cursor: default; }

  /* Calendar */
  .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-nav { display: flex; align-items: center; gap: 8px; }
  .cal-nav button {
    border: 0.5px solid var(--border); background: var(--white);
    border-radius: var(--radius-sm); width: 28px; height: 28px;
    cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center;
  }
  .cal-nav span { font-size: 13px; font-weight: 600; min-width: 90px; text-align: center; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-dow { text-align: center; font-size: 10px; color: var(--gray); padding: 4px 0; font-weight: 600; }
  .cal-day {
    aspect-ratio: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: 6px; font-size: 11px; cursor: default; gap: 1px; min-height: 36px;
  }
  .cal-day.today { background: #E1F5EE; font-weight: 700; color: #1D9E75; }
  .cal-day.submitted { background: var(--green-light); }
  .cal-day .check-mark { font-size: 14px; color: var(--green); }
  .cal-day .day-num { font-size: 10px; color: var(--gray); }
  .cal-day.submitted .day-num { color: var(--green); font-weight: 600; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--green); color: #fff;
    padding: 12px 24px; border-radius: 24px;
    font-size: 14px; font-weight: 500;
    transition: transform 0.3s ease; z-index: 999; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Admin toolbar */
  .admin-toolbar {
    background: var(--white); border-radius: var(--radius);
    border: 0.5px solid var(--border); padding: 14px 16px;
    margin-bottom: 16px; display: flex; gap: 10px; flex-wrap: wrap;
  }
  .admin-toolbar input, .admin-toolbar select {
    flex: 1; min-width: 120px; padding: 8px 12px;
    border: 0.5px solid var(--border); border-radius: var(--radius-sm);
    font-size: 13px; background: #fafaf8; outline: none; font-family: inherit;
  }
  .admin-toolbar input:focus, .admin-toolbar select:focus { border-color: var(--green-mid); }

  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-card {
    background: var(--white); border-radius: var(--radius-sm);
    border: 0.5px solid var(--border); padding: 14px; text-align: center;
  }
  .stat-card .stat-num { font-size: 24px; font-weight: 700; color: var(--green); }
  .stat-card .stat-label { font-size: 11px; color: var(--gray); margin-top: 4px; }

  /* Student list */
  .student-list { display: flex; flex-direction: column; gap: 10px; }
  .student-row {
    background: var(--white); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; cursor: pointer; transition: border-color 0.2s;
  }
  .student-row:hover { border-color: var(--green-mid); }
  .student-row.expanded { border-color: var(--green); }
  .student-row-header { display: flex; align-items: center; gap: 12px; }
  .student-avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--green-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: var(--green); flex-shrink: 0;
  }
  .student-info { flex: 1; }
  .student-info .name { font-size: 14px; font-weight: 600; }
  .student-info .school { font-size: 11px; color: var(--gray); margin-top: 1px; }
  .submission-badge {
    background: var(--green-light); color: var(--green);
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 12px;
  }
  .submission-badge.zero { background: var(--gray-light); color: var(--gray); }

  .admin-detail { display: none; margin-top: 14px; padding-top: 14px; border-top: 0.5px solid var(--border); }
  .admin-detail.open { display: block; }

  .mini-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 8px; }
  .mini-cal-day {
    aspect-ratio: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: 4px; font-size: 9px; min-height: 28px;
  }
  .mini-cal-day.submitted { background: var(--green-light); }
  .mini-cal-day .mini-check { font-size: 10px; color: var(--green); }
  .mini-cal-day .mini-num { font-size: 9px; color: #888; }
  .mini-cal-day.submitted .mini-num { color: var(--green); font-weight: 600; }

  .sub-files { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .sub-file {
    background: var(--gray-light); border-radius: var(--radius-sm);
    overflow: hidden; width: 90px; cursor: pointer;
    border: 0.5px solid var(--border); transition: border-color 0.2s;
  }
  .sub-file:hover { border-color: var(--green-mid); }
  .sub-file img, .sub-file video { width: 100%; height: 70px; object-fit: cover; display: block; }
  .sub-file-label {
    font-size: 9px; color: var(--gray); padding: 3px 5px;
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .admin-cal-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .admin-cal-nav span { font-size: 13px; font-weight: 600; min-width: 80px; text-align: center; }
  .admin-cal-nav button {
    border: 0.5px solid var(--border); background: var(--white); border-radius: 6px;
    width: 26px; height: 26px; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }

  .no-submissions { font-size: 13px; color: var(--gray); text-align: center; padding: 24px; }

  /* Lightbox */
  .lightbox {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.85); z-index: 9999;
    align-items: center; justify-content: center; padding: 20px;
  }
  .lightbox.open { display: flex; }
  .lightbox-close {
    position: fixed; top: 16px; right: 16px;
    background: rgba(255,255,255,0.2); border: none; color: #fff;
    font-size: 20px; width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  /* Remind panel */
  .remind-btn {
    width: 100%; padding: 12px;
    background: #F7C175; color: #633806; border: none;
    border-radius: var(--radius-sm); font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit; margin-bottom: 16px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background 0.2s;
  }
  .remind-btn:hover { background: #EF9F27; }

  .remind-panel {
    background: var(--white); border: 0.5px solid #FAC775;
    border-radius: var(--radius); margin-bottom: 16px; overflow: hidden;
  }
  .remind-panel-header {
    background: #FAEEDA; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .remind-panel-header h3 { font-size: 14px; font-weight: 700; color: #633806; }
  .rph-count {
    font-size: 12px; background: #EF9F27; color: #fff;
    border-radius: 10px; padding: 2px 10px; font-weight: 700;
  }
  .remind-close-btn { background: none; border: none; color: #854F0B; cursor: pointer; font-size: 16px; padding: 0 4px; }

  .remind-msg-template { padding: 12px 16px; border-bottom: 0.5px solid #FAC775; }
  .remind-msg-template label { font-size: 11px; color: var(--gray); font-weight: 600; display: block; margin-bottom: 6px; }
  .remind-msg-template textarea {
    width: 100%; padding: 8px 10px;
    border: 0.5px solid #FAC775; border-radius: var(--radius-sm);
    font-size: 13px; font-family: inherit; resize: vertical;
    min-height: 72px; background: #fffdf7; outline: none; line-height: 1.6;
  }
  .remind-msg-template textarea:focus { border-color: #EF9F27; }

  .bulk-send-btn {
    display: block; width: calc(100% - 32px); margin: 12px 16px;
    padding: 11px; background: #06C755; color: #fff; border: none;
    border-radius: var(--radius-sm); font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: opacity 0.2s;
  }
  .bulk-send-btn:hover { opacity: 0.85; }
  .bulk-send-btn:disabled { opacity: 0.5; cursor: default; }

  .remind-list { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .remind-item {
    background: #fffdf7; border: 0.5px solid #FAC775;
    border-radius: var(--radius-sm); padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .remind-item-name { font-size: 13px; font-weight: 700; color: #412402; }
  .remind-item-meta { font-size: 11px; color: #854F0B; }
  .remind-status-linked { font-size: 11px; font-weight: 600; color: #3B6D11; }
  .remind-status-none { font-size: 11px; color: #aaa; }
  .remind-none { padding: 20px; text-align: center; font-size: 13px; color: var(--gray); }

  /* Password modal */
  .pw-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 500;
    align-items: center; justify-content: center; padding: 20px;
  }
  .pw-overlay.open { display: flex; }
  .pw-modal {
    background: var(--white); border-radius: var(--radius);
    padding: 28px 24px; width: 100%; max-width: 340px; text-align: center;
  }
  .pw-modal .lock-icon { font-size: 36px; margin-bottom: 12px; }
  .pw-modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .pw-modal p { font-size: 12px; color: var(--gray); margin-bottom: 20px; }
  .pw-modal input {
    width: 100%; padding: 12px 14px;
    border: 0.5px solid var(--border); border-radius: var(--radius-sm);
    font-size: 16px; text-align: center; letter-spacing: 0.2em;
    outline: none; margin-bottom: 12px; font-family: inherit; transition: border-color 0.2s;
  }
  .pw-modal input:focus { border-color: var(--green-mid); }
  .pw-modal input.error { border-color: #E24B4A; animation: shake 0.3s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .pw-modal .pw-submit {
    width: 100%; padding: 12px; background: var(--green); color: #fff; border: none;
    border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: background 0.2s;
  }
  .pw-modal .pw-submit:hover { background: var(--green-mid); }
  .pw-modal .pw-cancel {
    margin-top: 10px; background: none; border: none;
    color: var(--gray); font-size: 13px; cursor: pointer; font-family: inherit; padding: 4px;
  }
  .pw-error-msg { font-size: 12px; color: #E24B4A; margin-top: -6px; margin-bottom: 10px; min-height: 16px; }

  @media (max-width: 480px) {
    .stat-card .stat-num { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="app-header">
  <h1>📚 英語課題提出</h1>
  <div style="display:flex;align-items:center">
    <div class="mode-toggle">
      <button class="mode-btn active" onclick="switchMode('student')">提出</button>
      <button class="mode-btn" onclick="switchMode('admin')">管理者</button>
    </div>
    <button class="admin-logout" id="logout-btn" style="display:none" onclick="adminLogout()">ログアウト</button>
  </div>
</div>

<!-- Admin password modal -->
<div class="pw-overlay" id="pw-overlay">
  <div class="pw-modal">
    <div class="lock-icon">🔐</div>
    <h3>管理者認証</h3>
    <p>管理者パスワードを入力してください</p>
    <input type="password" id="pw-input" placeholder="••••••" maxlength="20"
      onkeydown="if(event.key==='Enter')checkPassword()">
    <div class="pw-error-msg" id="pw-error"></div>
    <button class="pw-submit" onclick="checkPassword()">ログイン</button>
    <br>
    <button class="pw-cancel" onclick="cancelAdminLogin()">キャンセル</button>
  </div>
</div>

<!-- STUDENT SCREEN -->
<div id="screen-student" class="screen active">

  <div class="card">
    <h2>📝 プロフィール</h2>
    <div class="form-row">
      <label>校舎名</label>
      <select id="s-school">
        <option value="">選択してください</option>
        <optgroup label="── エイメイ学院 ──">
          <option>エイメイ学院みずほ台校舎</option>
          <option>エイメイ学院鶴瀬校舎</option>
          <option>エイメイ学院ふじみ野校舎</option>
          <option>エイメイ学院トナリエふじみ野校舎</option>
          <option>エイメイ学院水谷校舎</option>
          <option>エイメイ学院柳瀬川志木校舎</option>
          <option>エイメイ学院朝霞台北原校舎</option>
          <option>エイメイ学院川越南大塚校舎</option>
          <option>エイメイ学院上福岡清水町校舎</option>
          <option>エイメイ学院新座志木校舎</option>
        </optgroup>
        <optgroup label="── 明成個別 ──">
          <option>明成個別鶴瀬東校舎</option>
          <option>明成個別鶴瀬西校舎</option>
          <option>明成個別ふじみ野西口校舎</option>
          <option>明成個別上福岡校舎</option>
          <option>明成個別水谷校舎</option>
          <option>明成個別新河岸校舎</option>
          <option>明成個別南古谷校舎</option>
          <option>明成個別富士見羽沢校舎</option>
          <option>明成個別朝霞台校舎</option>
          <option>明成個別志木校舎</option>
          <option>明成個別三芳藤久保校舎</option>
          <option>明成個別トナリエふじみ野校舎</option>
        </optgroup>
        <optgroup label="── Luce個別指導 ──">
          <option>Luce個別指導みずほ台校舎</option>
          <option>Luce個別指導鶴瀬校舎</option>
        </optgroup>
      </select>
    </div>
    <div class="form-row">
      <label>学年</label>
      <select id="s-grade">
        <option value="">選択してください</option>
        <option value="中1">中学1年</option>
        <option value="中2">中学2年</option>
        <option value="中3">中学3年</option>
      </select>
    </div>
    <div class="form-row">
      <label>氏名</label>
      <input type="text" id="s-name" placeholder="例：山田 太郎">
    </div>
  </div>

  <div class="card">
    <h2>📤 課題を提出する</h2>
    <div class="upload-area">
      <input type="file" id="file-input" accept="image/*,video/*" multiple onchange="handleFiles(this.files)">
      <div class="upload-icon">📷</div>
      <strong>写真・動画を選択</strong>
      <p>タップしてファイルを追加<br>写真・タイムラプス動画に対応</p>
    </div>
    <div class="preview-area" id="preview-area"></div>
    <button class="submit-btn" onclick="submitHomework()">提出する</button>
  </div>

  <div class="card">
    <div class="calendar-header">
      <h2 style="margin-bottom:0">📅 提出カレンダー</h2>
      <div class="cal-nav">
        <button onclick="changeStudentMonth(-1)">‹</button>
        <span id="s-cal-label"></span>
        <button onclick="changeStudentMonth(1)">›</button>
      </div>
    </div>
    <div class="calendar-grid" id="s-calendar"></div>
  </div>

</div>

<!-- ADMIN SCREEN -->
<div id="screen-admin" class="screen">

  <div class="admin-toolbar">
    <input type="text" id="admin-search" placeholder="🔍 氏名で検索" oninput="renderAdmin()">
    <select id="admin-school-filter" onchange="renderAdmin()">
      <option value="">全校舎</option>
      <optgroup label="── エイメイ学院 ──">
        <option>エイメイ学院みずほ台校舎</option>
        <option>エイメイ学院鶴瀬校舎</option>
        <option>エイメイ学院ふじみ野校舎</option>
        <option>エイメイ学院トナリエふじみ野校舎</option>
        <option>エイメイ学院水谷校舎</option>
        <option>エイメイ学院柳瀬川志木校舎</option>
        <option>エイメイ学院朝霞台北原校舎</option>
        <option>エイメイ学院川越南大塚校舎</option>
        <option>エイメイ学院上福岡清水町校舎</option>
        <option>エイメイ学院新座志木校舎</option>
      </optgroup>
      <optgroup label="── 明成個別 ──">
        <option>明成個別鶴瀬東校舎</option>
        <option>明成個別鶴瀬西校舎</option>
        <option>明成個別ふじみ野西口校舎</option>
        <option>明成個別上福岡校舎</option>
        <option>明成個別水谷校舎</option>
        <option>明成個別新河岸校舎</option>
        <option>明成個別南古谷校舎</option>
        <option>明成個別富士見羽沢校舎</option>
        <option>明成個別朝霞台校舎</option>

{name} さん、こんにちは。

本日の英語課題がまだ提出されていません📚

ご不明な点はお気軽にお問い合わせください。</textarea>

<script>
// ===== DATA =====
let submissions = {};
let pendingFiles = [];
const STORAGE_KEY = 'eimei_hw_submissions';

function loadData() {
  try { const d = localStorage.getItem(STORAGE_KEY); if (d) submissions = JSON.parse(d); } catch(e) {}
}
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(submissions)); } catch(e) {}
}
loadData();

// ===== LINE USER IDs =====
const LINE_USERS_KEY = 'eimei_line_users';
let lineUsers = {};
function loadLineUsers() {
  try { const d = localStorage.getItem(LINE_USERS_KEY); if (d) lineUsers = JSON.parse(d); } catch(e) {}
}
function saveLineUsers() {
  try { localStorage.setItem(LINE_USERS_KEY, JSON.stringify(lineUsers)); } catch(e) {}
}
loadLineUsers();

async function syncStudentUserIds() {
  try {
    const res = await fetch('/api/get-student-users');
    if (!res.ok) return;
    const serverMap = await res.json();
    let updated = false;
    for (const [key, uid] of Object.entries(serverMap)) {
      if (uid && !lineUsers[key]) { lineUsers[key] = uid; updated = true; }
    }
    if (updated) saveLineUsers();
  } catch {}
}

// ===== AUTH =====
const ADMIN_PASSWORD = 'eimei2024';
let adminAuthed = false;

function switchMode(mode) {
  if (mode === 'admin' && !adminAuthed) { openPasswordModal(); return; }
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelector(`[onclick="switchMode('${mode}')"]`).classList.add('active');
  document.getElementById('screen-' + mode).classList.add('active');
  document.getElementById('logout-btn').style.display = mode === 'admin' ? 'inline-block' : 'none';
  if (mode === 'admin') syncStudentUserIds().then(() => renderAdmin());
  if (mode === 'student') renderStudentCalendar();
}

function openPasswordModal() {
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-error').textContent = '';
  document.getElementById('pw-input').classList.remove('error');
  document.getElementById('pw-overlay').classList.add('open');
  setTimeout(() => document.getElementById('pw-input').focus(), 100);
}

function checkPassword() {
  const val = document.getElementById('pw-input').value;
  if (val === ADMIN_PASSWORD) {
    adminAuthed = true;
    document.getElementById('pw-overlay').classList.remove('open');
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelector(`[onclick="switchMode('admin')"]`).classList.add('active');
    document.getElementById('screen-admin').classList.add('active');
    document.getElementById('logout-btn').style.display = 'inline-block';
    syncStudentUserIds().then(() => renderAdmin());
  } else {
    const inp = document.getElementById('pw-input');
    inp.classList.add('error');
    document.getElementById('pw-error').textContent = 'パスワードが違います';
    inp.value = '';
    setTimeout(() => inp.classList.remove('error'), 400);
  }
}

function cancelAdminLogin() {
  document.getElementById('pw-overlay').classList.remove('open');
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[onclick="switchMode('student')"]`).classList.add('active');
  document.getElementById('screen-student').classList.add('active');
}

function adminLogout() {
  adminAuthed = false;
  document.getElementById('logout-btn').style.display = 'none';
  switchMode('student');
}

// ===== STUDENT CALENDAR =====
let studentMonth = new Date();
studentMonth.setDate(1);

function renderStudentCalendar() {
  const name = document.getElementById('s-name').value.trim();
  const school = document.getElementById('s-school').value;
  const grade = document.getElementById('s-grade').value;
  const key = school + '_' + grade + '_' + name;
  const subs = (name && school && grade) ? (submissions[key] || []) : [];
  const submittedDates = new Set(subs.map(s => s.date));

  const y = studentMonth.getFullYear();
  const m = studentMonth.getMonth();
  document.getElementById('s-cal-label').textContent = `${y}年${m+1}月`;

  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  const dows = ['日','月','火','水','木','金','土'];
  let html = dows.map(d => `<div class="cal-dow">${d}</div>`).join('');
  for (let i = 0; i < firstDay; i++) html += `<div class="cal-day"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === todayStr;
    const isSubmitted = submittedDates.has(dateStr);
    const cls = isToday ? 'today' : isSubmitted ? 'submitted' : '';
    html += `<div class="cal-day ${cls}">
      ${isSubmitted ? '<span class="check-mark">✔</span>' : ''}
      <span class="day-num">${d}</span>
    </div>`;
  }
  document.getElementById('s-calendar').innerHTML = html;
}

function changeStudentMonth(delta) {
  studentMonth.setMonth(studentMonth.getMonth() + delta);
  renderStudentCalendar();
}

document.getElementById('s-name').addEventListener('input', renderStudentCalendar);
document.getElementById('s-school').addEventListener('change', renderStudentCalendar);
document.getElementById('s-grade').addEventListener('change', renderStudentCalendar);
renderStudentCalendar();

// ===== FILE HANDLING =====
function handleFiles(fileList) {
  Array.from(fileList).forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      pendingFiles.push({ name: file.name, type: file.type, dataUrl: e.target.result });
      renderPreview();
    };
    reader.readAsDataURL(file);
  });
}

function renderPreview() {
  document.getElementById('preview-area').innerHTML = pendingFiles.map((f, i) => {
    const isVideo = f.type.startsWith('video');
    const media = isVideo
      ? `<video src="${f.dataUrl}" muted playsinline></video>`
      : `<img src="${f.dataUrl}" alt="">`;
    return `<div class="preview-item">${media}<button class="preview-remove" onclick="removeFile(${i})">✕</button></div>`;
  }).join('');
}

function removeFile(idx) {
  pendingFiles.splice(idx, 1);
  renderPreview();
}

// ===== SUBMIT =====
function submitHomework() {
  const name = document.getElementById('s-name').value.trim();
  const school = document.getElementById('s-school').value;
  const grade = document.getElementById('s-grade').value;
  if (!name || !school || !grade) { showToast('校舎・学年・氏名を入力してください'); return; }
  if (pendingFiles.length === 0) { showToast('ファイルを選択してください'); return; }

  const key = school + '_' + grade + '_' + name;
  const today = new Date();
  const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  if (!submissions[key]) submissions[key] = [];
  let entry = submissions[key].find(e => e.date === dateStr);
  if (!entry) {
    entry = { date: dateStr, files: [], name, school, grade };
    submissions[key].push(entry);
  }
  entry.files.push(...pendingFiles);

  const imagesToUpload = pendingFiles.filter(f => f.type.startsWith('image/'));
  saveData();
  pendingFiles = [];
  renderPreview();
  document.getElementById('file-input').value = '';
  renderStudentCalendar();
  showToast('✔ 提出しました！');

  (async () => {
    try {
      const imageUrls = [];
      for (const file of imagesToUpload) {
        try {
          const compressed = await compressImage(file.dataUrl);
          if (!compressed || compressed.length > 4_000_000) continue;
          const res = await fetch('/api/upload-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dataUrl: compressed, filename: file.name.replace(/\.[^.]+$/, '.jpg') }),
          });
          if (res.ok) { const data = await res.json(); if (data.url) imageUrls.push(data.url); }
        } catch {}
      }
      const myLineId = localStorage.getItem('eimei_my_line_id') || '';
      await fetch('/api/notify-admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, school, grade, date: dateStr, fileCount: entry.files.length, imageUrls, userId: myLineId || undefined }),
      });
    } catch {}
  })();
}

function compressImage(dataUrl) {
  return new Promise((resolve) => {
    let objectUrl = null;
    try {
      const arr = dataUrl.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      const u8arr = new Uint8Array(bstr.length);
      for (let i = 0; i < bstr.length; i++) u8arr[i] = bstr.charCodeAt(i);
      objectUrl = URL.createObjectURL(new Blob([u8arr], { type: mime }));
    } catch {}
    const img = new Image();
    img.onerror = () => { if (objectUrl) URL.revokeObjectURL(objectUrl); resolve(null); };
    img.onload = () => {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      const compress = (maxWidth, quality) => {
        let { width, height } = img;
        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        return canvas.toDataURL('image/jpeg', quality);
      };
      let result = compress(1280, 0.75);
      if (!result || result.length < 100) { resolve(null); return; }
      if (result.length > 3_000_000) result = compress(960, 0.6);
      resolve(result.length > 100 ? result : null);
    };
    img.src = objectUrl || dataUrl;
  });
}

// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ===== ADMIN =====
let adminExpandedKey = null;
let adminMonths = {};

function todayDateStr() {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}

function getStudents() {
  const search = document.getElementById('admin-search').value.trim().toLowerCase();
  const school = document.getElementById('admin-school-filter').value;
  const grade = document.getElementById('admin-grade-filter').value;
  return Object.entries(submissions)
    .map(([key, subs]) => {
      const first = subs[0] || {};
      return { key, name: first.name || key, school: first.school || '', grade: first.grade || '', subs };
    })
    .filter(s => {
      if (school && s.school !== school) return false;
      if (grade && s.grade !== grade) return false;
      if (search && !s.name.includes(search)) return false;
      return true;
    });
}

function renderAdmin() {
  const todayStr = todayDateStr();
  const monthStr = todayStr.slice(0, 7);
  const totalStudents = Object.keys(submissions).length;
  const submittedTodayKeys = new Set(
    Object.entries(submissions)
      .filter(([, subs]) => subs.some(s => s.date === todayStr))
      .map(([key]) => key)
  );

  document.getElementById('stats-row').innerHTML = `
    <div class="stat-card"><div class="stat-num">${totalStudents}</div><div class="stat-label">登録生徒数</div></div>
    <div class="stat-card"><div class="stat-num">${submittedTodayKeys.size}</div><div class="stat-label">本日提出済み</div></div>
    <div class="stat-card"><div class="stat-num">${totalStudents - submittedTodayKeys.size}</div><div class="stat-label">本日未提出</div></div>
  `;

  const unsubmitted = getUnsubmittedToday();
  const countEl = document.getElementById('remind-unsubmitted-count');
  if (countEl) countEl.textContent = unsubmitted.length > 0 ? `未提出 ${unsubmitted.length}人` : '全員提出済み ✔';

  const students = getStudents();
  const listEl = document.getElementById('student-list');
  const noData = document.getElementById('no-data');
  if (students.length === 0) { listEl.innerHTML = ''; noData.style.display = 'block'; return; }
  noData.style.display = 'none';

  listEl.innerHTML = students.map(s => {
    const count = s.subs.length;
    const initials = s.name.slice(0, 2);
    const isExpanded = adminExpandedKey === s.key;
    const submittedToday = s.subs.some(sub => sub.date === todayStr);
    return `<div class="student-row ${isExpanded ? 'expanded' : ''}" onclick="toggleStudent('${s.key}')">
      <div class="student-row-header">
        <div class="student-avatar" style="${submittedToday ? '' : 'background:#FAECE7;color:#993C1D'}">${initials}</div>
        <div class="student-info">
          <div class="name">${s.name}</div>
          <div class="school">${s.school}　${s.grade}</div>
        </div>
        <div class="submission-badge ${count === 0 ? 'zero' : ''}">${count}回提出</div>
      </div>
      <div class="admin-detail ${isExpanded ? 'open' : ''}" id="detail-${s.key}">
        ${renderStudentDetail(s)}
      </div>
    </div>`;
  }).join('');
}

function renderStudentDetail(s) {
  if (!adminMonths[s.key]) { const d = new Date(); d.setDate(1); adminMonths[s.key] = d; }
  const m = adminMonths[s.key];
  const y = m.getFullYear();
  const mo = m.getMonth();

  const submittedDates = new Set(s.subs.map(sub => sub.date));
  const firstDay = new Date(y, mo, 1).getDay();
  const daysInMonth = new Date(y, mo+1, 0).getDate();
  const dows = ['日','月','火','水','木','金','土'];
  let calHtml = dows.map(d => `<div class="cal-dow" style="font-size:9px">${d}</div>`).join('');
  for (let i = 0; i < firstDay; i++) calHtml += `<div class="mini-cal-day"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const ok = submittedDates.has(dateStr);
    calHtml += `<div class="mini-cal-day ${ok ? 'submitted' : ''}">
      ${ok ? '<span class="mini-check">✔</span>' : ''}
      <span class="mini-num">${d}</span>
    </div>`;
  }

  const monthStr = `${y}-${String(mo+1).padStart(2,'0')}`;
  const monthSubs = s.subs.filter(sub => sub.date && sub.date.startsWith(monthStr));
  const allFiles = monthSubs.flatMap(sub => sub.files.map(f => ({...f, date: sub.date})));

  const filesHtml = allFiles.length > 0
    ? allFiles.map((f, idx) => {
        const isVideo = f.type && f.type.startsWith('video');
        const media = isVideo ? `<video src="${f.dataUrl}" muted></video>` : `<img src="${f.dataUrl}" alt="">`;
        return `<div class="sub-file" onclick="openLightbox(event,'${s.key}',${idx},'${monthStr}')">
          ${media}
          <div class="sub-file-label">${f.date ? f.date.slice(5) : ''} ${f.name || ''}</div>
        </div>`;
      }).join('')
    : '<div style="font-size:12px;color:#888;padding:8px 0">この月の提出はありません</div>';

  return `
    <div class="admin-cal-nav">
      <button onclick="adminChangeMonth(event,'${s.key}',-1)">‹</button>
      <span>${y}年${mo+1}月</span>
      <button onclick="adminChangeMonth(event,'${s.key}',1)">›</button>
    </div>
    <div class="mini-cal-grid">${calHtml}</div>
    <div style="margin-top:12px;font-size:12px;font-weight:600;color:#5F5E5A;margin-bottom:6px">提出ファイル</div>
    <div class="sub-files">${filesHtml}</div>
  `;
}

function adminChangeMonth(e, key, delta) {
  e.stopPropagation();
  const m = adminMonths[key] || new Date();
  m.setMonth(m.getMonth() + delta);
  adminMonths[key] = m;
  const s = getStudents().find(st => st.key === key);
  if (s) document.getElementById('detail-' + key).innerHTML = renderStudentDetail(s);
}

function toggleStudent(key) {
  adminExpandedKey = adminExpandedKey === key ? null : key;
  renderAdmin();
}

// ===== REMIND PANEL =====
let remindPanelOpen = false;

function getUnsubmittedToday() {
  const todayStr = todayDateStr();
  return Object.entries(submissions)
    .map(([key, subs]) => {
      const first = subs[0] || {};
      return { key, name: first.name || '', school: first.school || '', grade: first.grade || '', subs };
    })
    .filter(s => s.name && !s.subs.some(sub => sub.date === todayStr));
}

function buildRemindMsg(name) {
  return document.getElementById('remind-template').value.replace(/\{name\}/g, name);
}

function toggleRemindPanel() {
  remindPanelOpen = !remindPanelOpen;
  const panel = document.getElementById('remind-panel');
  if (remindPanelOpen) { panel.style.display = 'block'; renderRemindPanel(); }
  else panel.style.display = 'none';
}

document.addEventListener('DOMContentLoaded', () => {
  const ta = document.getElementById('remind-template');
  if (ta) ta.addEventListener('input', () => { if (remindPanelOpen) renderRemindPanel(); });
});

function renderRemindPanel() {
  const today = new Date();
  document.getElementById('remind-today-label').textContent = `${today.getMonth()+1}月${today.getDate()}日`;
  const unsubmitted = getUnsubmittedToday();
  document.getElementById('remind-count-badge').textContent = `${unsubmitted.length}人`;

  const listEl = document.getElementById('remind-list');
  const bulkBtn = document.getElementById('bulk-send-btn');

  if (unsubmitted.length === 0) {
    listEl.innerHTML = `<div class="remind-none">🎉 本日は全員が提出済みです！</div>`;
    bulkBtn.style.display = 'none';
    return;
  }

  const linkedCount = unsubmitted.filter(s => lineUsers[s.key]).length;
  bulkBtn.style.display = 'block';
  bulkBtn.textContent = linkedCount > 0
    ? `📨 LINE連携済み ${linkedCount}人に一括送信`
    : '📨 一括送信（LINE未連携者のみ）';

  listEl.innerHTML = unsubmitted.map(s => {
    const linked = !!lineUsers[s.key];
    return `<div class="remind-item">
      <div>
        <div class="remind-item-name">${s.name}</div>
        <div class="remind-item-meta">${s.school}　${s.grade}</div>
      </div>
      <span class="${linked ? 'remind-status-linked' : 'remind-status-none'}">
        ${linked ? '✔ LINE連携済み' : 'LINE未連携'}
      </span>
    </div>`;
  }).join('');
}

async function sendAllReminders() {
  const unsubmitted = getUnsubmittedToday();
  const targets = unsubmitted.filter(s => lineUsers[s.key]);
  if (targets.length === 0) { showToast('LINE連携済みの未提出者がいません'); return; }

  const btn = document.getElementById('bulk-send-btn');
  btn.textContent = `送信中... (0/${targets.length})`;
  btn.disabled = true;

  let ok = 0, fail = 0;
  for (const s of targets) {
    const msg = buildRemindMsg(s.name);
    try {
      const res = await fetch('/api/send-line', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: lineUsers[s.key], message: msg, type: 'reminder' }),
      });
      if (res.ok) ok++; else fail++;
    } catch { fail++; }
    btn.textContent = `送信中... (${ok + fail}/${targets.length})`;
  }

  btn.disabled = false;
  btn.textContent = `📨 LINE連携済み ${targets.length}人に一括送信`;
  showToast(fail === 0
    ? `✔ ${ok}人にLINE送信しました`
    : `送信完了：成功 ${ok}人 / 失敗 ${fail}人`
  );
}

// ===== LIGHTBOX =====
let lightboxFiles = [];

function openLightbox(e, key, idx, monthStr) {
  e.stopPropagation();
  const s = Object.entries(submissions).find(([k]) => k === key);
  if (!s) return;
  const monthSubs = s[1].filter(sub => sub.date && sub.date.startsWith(monthStr));
  lightboxFiles = monthSubs.flatMap(sub => sub.files.map(f => ({...f, date: sub.date})));
  const f = lightboxFiles[idx];
  if (!f) return;
  const isVideo = f.type && f.type.startsWith('video');
  document.getElementById('lightbox-content').innerHTML = isVideo
    ? `<video src="${f.dataUrl}" controls autoplay style="max-width:100%;max-height:85vh;border-radius:8px" onclick="event.stopPropagation()"></video>`
    : `<img src="${f.dataUrl}" alt="" style="max-width:100%;max-height:85vh;border-radius:8px" onclick="event.stopPropagation()">`;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-content').innerHTML = '';
}
</script>
</body>
</html>
